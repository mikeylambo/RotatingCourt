<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1b1220">
  <meta name="description" content="Rule a court for 25 days. Stop the wheel.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Rotating Court</title>
  <style>
    html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#1b1220;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    #game-canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  </style>
</head>
<body>
  <div id="game"><canvas id="game-canvas" aria-label="Rotating Court"></canvas></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
